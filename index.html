  <style>
    /* Option A: If you export TAN-Nimbus.woff2/ttf from your files, drop it in fonts/ */
    @font-face {
      font-family: 'TAN-Nimbus';
      src: url('fonts/TAN-Nimbus.woff2') format('woff2'),
           url('fonts/TAN-Nimbus.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #2c3e50;
    }

    /* Lighter background filter over laptop image */
    .jumbotron-hero {
      min-height: 100vh;
      margin-bottom: 0;
      background-color: #1a252f;
      background-image: linear-gradient(rgba(17, 24, 39, 0.40), rgba(17, 24, 39, 0.40)), url('images/computer_img.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 80px;
    }

    .hero-pretitle {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f7f5f0;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .hero-name-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
    }

    /* Stylized capital 'B's matching the TAN Nimbus silhouette */
    .brand-b {
      font-family: 'TAN-Nimbus', 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.18em;
      display: inline-block;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .hero-tagline {
      font-size: 1.3rem;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      margin-bottom: 28px;
    }

    /* Typed text matching font color */
    .typed-text-accent {
      color: #ffffff;
      font-weight: 700;
    }

    /* Unified semi-translucent glass outline buttons */
    .btn-hero-unified {
      background-color: rgba(247, 245, 240, 0.12);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 6px;
      padding: 8px 18px;
      margin: 4px;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease-in-out;
      text-shadow: none;
    }

    .btn-hero-unified:hover {
      background-color: #ffffff;
      border-color: #ffffff;
      color: #1a252f;
    }
  </style>
</head>

        <div class="mt-2">
