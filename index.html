  <script>
    // Typed.js Animation
    var typed = new Typed(".auto-input", {
      strings: ["Software Engineering", "Machine Learning", "Visual Art & Oil Painting", "Systems Design", "Cloud Infrastructure"],
      typeSpeed: 80,
      backSpeed: 50,
      loop: true
    });

    // Painterly Canvas Animation
    const canvas = document.getElementById('paintingCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = 'images/computer_img.jpg'; // Path to your base computer image

    // Theme palette: Tan, Slate Blue, Light Blue, Deep Green
    const palette = [
      'rgba(226, 222, 213, 0.4)', // Tan
      'rgba(44, 62, 80, 0.4)',     // Slate Blue
      'rgba(123, 163, 196, 0.4)',  // Light Blue
      'rgba(30, 57, 42, 0.4)'      // Dark Green
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (img.complete) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
    }

    img.onload = function() {
      resizeCanvas();
      startPaintingEffect();
    };

    window.addEventListener('resize', resizeCanvas);

    function startPaintingEffect() {
      let strokeCount = 0;
      const maxStrokes = 1200; // Total strokes before finishing

      function renderStrokes() {
        if (strokeCount < maxStrokes) {
          // Draw a batch of 8 strokes per frame
          for (let i = 0; i < 8; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const radius = Math.random() * 22 + 8;
            const length = Math.random() * 45 + 15;
            const angle = (Math.random() - 0.5) * Math.PI / 3;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, length, radius, 0, 0, Math.PI * 2);
            ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
            ctx.fill();
            ctx.restore();

            strokeCount++;
          }
          requestAnimationFrame(renderStrokes);
        }
      }
      // Brief pause on the photo before the paint strokes begin
      setTimeout(renderStrokes, 700);
    }
  </script>
